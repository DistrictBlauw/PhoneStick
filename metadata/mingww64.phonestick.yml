AutoName: PhoneStick
Description: |-
  PhoneStick turns your rooted device into a USB Mass Storage drive
  or CD-ROM emulator using Linux Kernel ConfigFS and USB gadget drivers.

  Key Features:
  * Mount raw disk images (.img, .iso, .bin, .raw, .vhd) as USB flash drives or CD-ROMs
  * Modern Material Design 3 interface with animated speed-dial action menu
  * Zero-copy SAF URI path resolution for images stored on external SD cards
  * Supports read-only and CD-ROM emulation modes
  * Real-time Linux kernel LUN status detection

