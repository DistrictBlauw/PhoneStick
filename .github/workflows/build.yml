name: Build APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build (JDK 17, Gradle 8.7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle with build cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Show build outputs
        run: ls -la app/build/outputs/apk/debug app/build/outputs/apk/release

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phonestick-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phonestick-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Publish release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: phonestick-release-apk
          path: apk/

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
